# This workflow builds and tests the .NET backend and React frontend.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore tests/backend/ChessWeb.Tests.csproj
    - name: Audit NuGet dependencies
      run: dotnet list tests/backend/ChessWeb.Tests.csproj package --vulnerable --include-transitive
    - name: Build
      run: dotnet build tests/backend/ChessWeb.Tests.csproj --no-restore
    - name: Test
      run: dotnet test tests/backend/ChessWeb.Tests.csproj --no-build --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.22.2
        cache: npm
        cache-dependency-path: src/frontend/package-lock.json
    - name: Install dependencies
      run: npm ci --legacy-peer-deps
    - name: Audit npm dependencies
      run: npm audit --audit-level=high
    - name: Test
      run: npm run test:run
    - name: Build
      run: npm run build

  compose-security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify development ports are host-local
      shell: bash
      run: |
        docker compose -f docker-compose.dev.yml config --format json > compose.json
        jq -e '([.services.backend.ports[] | select(.target == 8080 and .host_ip == "127.0.0.1")] | length == 1) and ([.services.db.ports[] | select(.target == 1433 and .host_ip == "127.0.0.1")] | length == 1)' compose.json
