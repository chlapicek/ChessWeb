services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile.dev
    image: chessweb-frontend:dev-hot
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./src/frontend:/app
      - frontend-node-modules:/app/node_modules

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: chessweb-backend:dev
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      SeedDemoData: "true"
      ResetDemoAdminPassword: "true"
      UseSqlite: "false"
      FileStorage__Provider: Local
      FileStorage__BasePath: /var/lib/chessweb/uploads
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=ChessWebDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-ChessWebExample_password1!};TrustServerCertificate=True;
      Jwt__Key: ${JWT_SIGNING_KEY:-development-only-example-jwt-key-1234567890}
      ClamAv__Enabled: "true"
      ClamAv__Host: clamav
    volumes:
      - backend-uploads:/var/lib/chessweb/uploads
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
  clamav:
    image: clamav/clamav:stable
    environment:
      FRESHCLAM_CHECKS: "24"
    volumes:
      - clamav-db:/var/lib/clamav
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChessWebExample_password1!}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10
      timeout: 5s

volumes:
  backend-uploads:
  clamav-db:
  frontend-node-modules:
  mssql-data: