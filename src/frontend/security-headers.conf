# Shared by nginx (included in location blocks) and `vite preview` (parsed in vite.config.ts).
# 'wasm-unsafe-eval' is required by the Stockfish WebAssembly worker; blob: images are attachment previews and data: is the drag-and-drop ghost image.
# The style hashes allow only sonner's fixed runtime stylesheet (empty tag + its CSS); the same CSS is also bundled, so a sonner upgrade only logs a violation.
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'sha256-47DEQpj8HBSa+/TImW+5JCeuQeRkm5NMpJWZG3hSuFU=' 'sha256-7lAG9nNPimWNBky6j9qnn0jfFzu5wK96KOj/UzoG0hg='; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Enable wherever TLS is terminated (browsers ignore HSTS over plain HTTP):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
