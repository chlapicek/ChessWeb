version: "3.8"

services:
  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    image: chessweb-frontend:dev
    ports:
      - "0.0.0.0:3000:80"
    depends_on:
      - backend

  backend:
    # platform: linux/amd64
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    image: chessweb-backend:dev
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - FileStorage__Provider=Local
      - FileStorage__BasePath=/var/lib/chessweb/uploads
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=ChessWebDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose};TrustServerCertificate=True;
      - Jwt__Key=${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY before starting Compose}
    volumes:
      - backend-uploads:/var/lib/chessweb/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD before starting Compose}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      retries: 10
      timeout: 5s

volumes:
  backend-uploads:
  mssql-data: